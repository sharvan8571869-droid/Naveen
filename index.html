<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #fff;
  color: #050505;
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 780px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 14px 16px 40px;
}

/* Main profile image */
.profile {
  display: block;
  width: min(70vw, 530px);
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 50%;
  margin: 0 auto 28px;
}

/* Circular logo beside heading */
.heading-area {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0 auto 30px;
}

.heading-logo {
  width: 72px;
  height: 72px;
  object-fit: contain;
  border-radius: 50%;
  border: 3px solid #2e6cc5;
  flex-shrink: 0;
}

.heading-area h1 {
  font-size: clamp(23px, 5.5vw, 42px);
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: -0.5px;
  margin: 0;
}

/* Telegram join button */
.join-btn {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 8px;
  width: 100%;
  min-height: 90px;
  padding: 12px 10px;
  color: #fff;
  background: #2e6cc5;
  border: 11px dashed #f0ff35;
  border-radius: 24px;
  box-shadow: 0 3px 9px #888;
  text-decoration: none;
  font-size: clamp(22px, 6vw, 48px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 38px;
  animation: glow 1.5s infinite alternate;
}

.telegram-icon {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  background: #fff;
  color: #2e6cc5;
  border-radius: 50%;
  font-size: 25px;
}

@keyframes glow {
  from { box-shadow: 0 3px 8px #888; }
  to { box-shadow: 0 4px 16px #aaa; }
}

/* Countdown display */
.timer {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: clamp(5px, 2.5vw, 22px);
  color: #d10b20;
  font-family: Georgia, "Times New Roman", serif;
  margin: 0 auto 42px;
}

.timer-unit {
  min-width: 0;
}

.digits {
  font-size: clamp(23px, 5vw, 38px);
  font-weight: bold;
  white-space: nowrap;
}

.label {
  font-size: clamp(14px, 3.6vw, 28px);
  margin-top: 16px;
  white-space: nowrap;
}

/* Disclaimer */
.disclaimer {
  max-width: 740px;
  margin: 0 auto;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(16px, 3vw, 22px);
  line-height: 1.45;
}

@media (max-width: 420px) {
  .container {
    padding-left: 12px;
    padding-right: 12px;
  }

  .profile {
    margin-bottom: 24px;
  }

  .heading-area {
    gap: 8px;
  }

  .heading-logo {
    width: 56px;
    height: 56px;
  }

  .join-btn {
    min-height: 76px;
    border-width: 8px;
    font-size: clamp(19px, 5.5vw, 25px);
  }

  .telegram-icon {
    width: 34px;
    height: 34px;
    font-size: 20px;
  }

  .timer {
    gap: 6px;
  }

  .label {
    font-size: 14px;
  }
}
</style>
</head>

<body>
<main class="container">

  <!-- Main profile photo -->
  <img
    class="profile"
    src="profile.jpg"
    alt="Prediction With Naveen profile"
  >

  <!-- Circular logo beside heading -->
  <div class="heading-area">
    <img
      class="heading-logo"
      src="logo.jpg"
      alt="Prediction With Naveen logo"
    >

    <h1>Prediction With Naveen</h1>
  </div>

  <!-- Telegram button -->
  <a
    class="join-btn"
    href="https://t.me/+03PJHj7y7po3MjE9"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="telegram-icon" aria-hidden="true">➤</span>
    <span>JOIN FREE NOW</span>
    <span class="telegram-icon" aria-hidden="true">➤</span>
  </a>

  <!-- Static timer matching reference -->
  <section class="timer" aria-label="Countdown display">
    <div class="timer-unit">
      <div class="digits">00</div>
      <div class="label">DAYS</div>
    </div>

    <div class="digits">:</div>

    <div class="timer-unit">
      <div class="digits">00</div>
      <div class="label">HOURS</div>
    </div>

    <div class="digits">:</div>

    <div class="timer-unit">
      <div class="digits">00</div>
      <div class="label">MINUTES</div>
    </div>

    <div class="digits">:</div>

    <div class="timer-unit">
      <div class="digits">00</div>
      <div class="label">SECONDS</div>
    </div>
  </section>

  <p class="disclaimer">
    DISCLAIMER: This page is for informational and
    entertainment purposes only. No specific results
    or outcomes are guaranteed. We are not affiliated
    with Telegram or any third-party platform. 18+ only.
  </p>

</main>
</body>
</html>
